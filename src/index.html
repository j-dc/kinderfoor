<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Kinderfoor – Kuurne</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preload" as="image" href="/img/vuurwerk.png" />
    <link rel="stylesheet" href="/style/main.scss" />
    
    <link rel="apple-touch-icon" sizes="180x180" href="./img/favicon/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="./img/favicon/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="./img/favicon/favicon-16x16.png">
    <link rel="manifest" href="./img/favicon/site.webmanifest">
    <script data-goatcounter="https://kinderfoor.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>

  </head>
  <body>
    <header class="kf-page-header" id="kf-page-header">
      <img class="kf-garland kf-garland-left" src="/img/garland.png" alt="" aria-hidden="true" />
      <img class="kf-garland kf-garland-right" src="/img/garland.png" alt="" aria-hidden="true" />

      <img class="kf-center-logo" src="/img/logo/kinderfoor.webp" alt="Kinderfoor" />

      <div class="kf-fireworks" id="kf-fireworks" aria-hidden="true"></div>

      <div class="kf-header-inner">
        <img class="kf-brand" src="/img/logo/kinderfoor_new.webp" alt="Kinderfoor" />
        <img class="kf-tent" src="/img/tent.webp" alt="Kinderfoor" />

        <div class="kf-event-row">
          <span class="kf-date-text"><strong>20</strong> september 2026</span>
        </div>

        <div class="kf-event-row kf-event-row-time">
          <span>Vanaf 13u30</span>
        </div>

        <div class="kf-event-row kf-event-row-location">
          <span>Sportpark Kuurne</span>
        </div>

        <div class="kf-event-row kf-event-row-free">
          <span>Gratis evenement</span>
        </div>
      </div>
    </header>

    <main class="kf-main">
      <section class="kf-sponsors" aria-labelledby="sponsors-title">
        <h2 id="sponsors-title">Onze sponsors</h2>

        <div class="kf-sponsors-grid">
          <div class="kf-sponsor-item kf-sponsor-kuurne"><img src="/img/logo/kuurne.svg" alt="Kuurne" /></div>
          <div class="kf-sponsor-item"><img src="/img/logo/slagerijstijn.webp" alt="Slagerij Stijn" /></div>
          <div class="kf-sponsor-item"><img src="/img/logo/nestr.svg" alt="Nestr" /></div>
          <div class="kf-sponsor-item"><img src="/img/logo/agristo.png" alt="Agristo" /></div>
          <div class="kf-sponsor-item"><img src="/img/logo/flextra.png" alt="Flextra Interim" /></div>
          <div class="kf-sponsor-item kf-sponsor-reatub"><img src="/img/logo/reatub.png" alt="Reatub" /></div>
          <div class="kf-sponsor-item kf-sponsor-colora"><img src="/img/logo/colora.webp" alt="Colora Kuurne" /></div>
          <div class="kf-sponsor-item kf-sponsor-ververie"><img src="/img/logo/ververie.webp" alt="Ververie" /></div>
          <div class="kf-sponsor-item"><img src="/img/logo/dronkenezel.webp" alt="Dronken Ezel" /></div>
          <div class="kf-sponsor-item kf-sponsor-sportkafee"><img src="/img/logo/sportkafee.webp" alt="Sport Kafee" /></div>
          <div class="kf-sponsor-item kf-sponsor-F07"><img src="/img/logo/fort07.webp" alt="Fort 07" /></div>
          <div class="kf-sponsor-item kf-sponsor-stmichiel"><img src="/img/logo/stmichiel.svg" alt="Sint-Michiels" /></div>
        </div>
      </section>
    </main>

    <script type="module" src="/ts/main.js"></script>
  </body>
</html>
